<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課務營運稽核系統</title>
<!--
  報備系統的 LINE 登入入口（LIFF）。原稿在 EzdonReportSystem/web/report.html，發布時複製到公開 repo ezdon-portal 的 report.html。
  LIFF 在 Apps Script 的網頁裡會卡住，所以入口另放在 GitHub Pages：
  這頁只取得 LINE ID token，然後轉到報備系統網址「#lt=<ID token>&go=<目的地>」，由報備系統向 LINE 驗證並登入。
  報備系統網頁本身也放在同一個 repo（report-system.html，由 EzdonReportSystem 的 web/build-web.js 產生）。
  這頁不存任何資料，也沒有密鑰（LIFF ID 與網址都不是機密）。
-->
<style>
  body { margin: 0; font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: #f5f5f4; color: #1c1917; }
  main { max-width: 420px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  .muted { color: #78716c; font-size: 14px; }
  .err { color: #b91c1c; margin-top: 16px; }
  a.btn { display: inline-block; margin-top: 20px; padding: 10px 18px; border-radius: 8px; background: #1c1917; color: #fff; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h2>課務營運稽核系統</h2>
  <p class="muted" id="msg">正在用 LINE 登入…</p>
  <div id="err" class="err"></div>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
var LIFF_ID = '2012353880-oGtwuWW2';
// 2026-11-24 改轉到靜態版報表系統（同一個 repo 的 report-system.html，沒有 Google 的橫幅）。
// 要退回舊版，改回 'https://script.google.com/macros/s/AKfycbzeJKpproQbowrEaRdP9yo09J90Z7kZSDoSuxsYHQvChIvbcDR2eQRtazNV6LVlcm3u/exec' 即可。
var WEBAPP_URL = 'https://a120004774.github.io/ezdon-portal/report-system.html';

function goParam() {
  var q = new URLSearchParams(location.search);
  var g = q.get('go');
  if (!g && q.get('liff.state')) g = new URLSearchParams(q.get('liff.state').replace(/^[^?]*\??/, '')).get('go');
  g = String(g || '');
  return /^[A-Za-z0-9-]{1,30}$/.test(g) ? g : '';
}
function fail(text) {
  document.getElementById('msg').textContent = '';
  var e = document.getElementById('err');
  e.textContent = text;
  var a = document.createElement('a'); a.className = 'btn'; a.href = WEBAPP_URL; a.textContent = '改用帳號密碼登入';
  e.appendChild(document.createElement('br')); e.appendChild(a);
}
if (typeof liff === 'undefined') fail('LINE 元件無法載入，請稍後再試。');
else liff.init({ liffId: LIFF_ID }).then(function () {
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  var token = liff.getIDToken();
  if (!token) throw new Error('沒有取得 LINE 身分，請確認 LIFF 的 Scopes 有勾 openid');
  var go = goParam();
  location.replace(WEBAPP_URL + '#lt=' + encodeURIComponent(token) + (go ? '&go=' + encodeURIComponent(go) : ''));
}).catch(function (e) { fail('LINE 登入失敗：' + (e && e.message ? e.message : e)); });
</script>
</body>
</html>
