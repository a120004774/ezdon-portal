<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>一起動計薪資料</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2433;--muted:#667085;--line:#e4e7ec;--accent:#0f7b5f;--accent-soft:#e6f4f0;--err:#b42318;--err-soft:#fef3f2;--warn:#93600a;--warn-soft:#fdf6e3}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;margin:0;padding:12px 12px 32px;background:var(--bg);color:var(--text);font-size:16px;line-height:1.45}
body.has-bar{padding-bottom:150px}
h2{font-size:20px;margin:0 0 4px}h3{font-size:16px;margin:0}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.muted{color:var(--muted);font-size:14px}.err{color:var(--err)}
.notice{border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}.notice.bad{background:var(--err-soft);color:var(--err)}.notice.good{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#eaecf0;border-radius:10px;padding:4px;margin-bottom:10px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:9px 12px;min-height:42px;cursor:pointer}
button:disabled{opacity:.5}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;width:100%}
button.link{border:0;background:none;color:var(--accent);padding:6px 4px;min-height:34px;font-size:14px}
button.danger{color:var(--err)}
.chip{border-radius:999px;padding:6px 16px;min-height:38px}.chip.on{background:var(--text);border-color:var(--text);color:#fff}
.tab{border:0;background:none;padding:8px 2px;font-size:14px;min-height:40px}.tab.on{background:var(--card);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:172px;flex:none}
.choice{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;margin:10px 0 6px}
.choice label{display:flex;align-items:center;gap:8px;margin:0;min-height:40px;font-size:16px;color:var(--text);cursor:pointer}
.choice label.on{font-weight:600}
.choice input{width:22px;height:22px;min-height:0;margin:0;padding:0;flex:none;accent-color:var(--accent)}
.seg button{padding:6px 2px;min-height:38px;font-size:14px}
.seg button.pass{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.seg button.fail{background:var(--err-soft);border-color:var(--err);color:var(--err);font-weight:600}
.item{padding:8px 0;border-top:1px solid var(--line)}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input{font:inherit;width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;color:var(--text);min-height:44px}
input:disabled{background:#f2f4f7;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{margin-top:12px}.mb{margin-bottom:8px}.badge{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}.badge.todo{background:#f2f4f7;color:var(--muted)}.badge.edit{background:var(--warn-soft);color:var(--warn)}
.file{font-size:14px;padding:6px 0;word-break:break-all}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px rgba(0,0,0,.12)}
.bar .muted{margin-bottom:6px}
@keyframes ez-spin{to{transform:rotate(360deg)}}
@keyframes ez-slide{0%{left:-40%}100%{left:100%}}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:ez-spin .7s linear infinite;vertical-align:-3px;flex:none}
#progress{position:fixed;top:0;left:0;right:0;height:4px;overflow:hidden;background:var(--accent-soft);display:none;z-index:20}
#progress i{position:absolute;top:0;bottom:0;width:40%;background:var(--accent);animation:ez-slide 1.1s ease-in-out infinite}
#busy{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:var(--text);color:#fff;border-radius:999px;padding:10px 18px;font-size:15px;display:none;align-items:center;gap:10px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.3);width:max-content;max-width:calc(100% - 24px)}
body.has-bar #busy{bottom:calc(100px + env(safe-area-inset-bottom))}
.startup{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--accent);font-weight:600}.startup .spin{width:22px;height:22px;border-width:3px}
.pendingFile{color:var(--warn)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}.kv b{font-weight:600;text-align:right}
.badge.stale{background:var(--err-soft);color:var(--err)}
</style></head>
<body>
<div id="progress"><i></i></div>
<div class="card"><h2>一起動計薪資料</h2><div id="who" class="startup"><span class="spin"></span><span id="whoText">正在確認 LINE 身分…</span></div></div>
<div id="main"></div>
<div id="bar"></div>
<div id="busy"><span class="spin"></span><span id="busyText"></span></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// Public page: no secrets and no payroll data here; every API call is checked on the server with the LINE ID token.
var LIFF_ID='2012353880-kqKD1F4z';
var API_URL='https://script.google.com/macros/s/AKfycbwqvEO0m705ynEo4hXMqwLW-o01DoGCq_g0xU3vbP4B1sK9IhhC3ADQHVCYgKkBuyMH/exec';
function call(name){
 return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:name,args:[].slice.call(arguments,1)})})
  .then(function(res){return res.json()})
  .then(function(r){if(r&&r.ok)return r.result;throw Error(r?r.error:'沒有回應')});
}
function show(text,isErr){var d=document.getElementById('who');d.textContent=text;d.className=isErr?'err':'muted';working(false)}
function showStep(text){document.getElementById('whoText').textContent=text}
// While the system works: a moving bar on top from the very start, and a counter so a long wait doesn't look frozen.
function working(on){document.getElementById('progress').style.display=on?'block':'none'}
working(true);
// A failed SDK load or a hung call would otherwise leave the page on the first message forever.
var step='載入 LINE SDK',done=false;
var timer=setTimeout(function(){if(!done)show('逾時，停在：'+step,true)},60000);
function fail(e){done=true;clearTimeout(timer);show('錯誤（'+step+'）：'+(e&&e.message||e),true)}

// ---------- small DOM helper: text always goes through textContent, so names typed by people can't inject markup ----------
function el(tag,attrs){
 var n=document.createElement(tag);
 Object.keys(attrs||{}).forEach(function(k){
  if(k==='on')Object.keys(attrs.on).forEach(function(e){n.addEventListener(e,attrs.on[e])});
  else if(k==='class')n.className=attrs[k];
  else if(k==='text')n.textContent=attrs[k];
  else if(attrs[k]===false||attrs[k]===undefined||attrs[k]===null){}
  else if(k in n&&k!=='list')n[k]=attrs[k];
  else n.setAttribute(k,attrs[k]);
 });
 [].slice.call(arguments,2).forEach(function(c){if(c)n.appendChild(typeof c==='string'?document.createTextNode(c):c)});
 return n;
}
// Always Taipei time, whatever the phone is set to (deadlines must read the same for everyone).
function localTime(iso){var d=new Date(Date.parse(iso)+8*3600e3);return isNaN(d)?'':(d.getUTCMonth()+1)+'/'+d.getUTCDate()+' '+('0'+d.getUTCHours()).slice(-2)+':'+('0'+d.getUTCMinutes()).slice(-2)}

// ---------- manager screen ----------
var EVAL_ITEMS=[['admin','行政考核'],['execution','執行考核'],['target','經理指定目標']];
function failReason(v,k){return String(((v.failReasons||{})[k])||'').trim()}
// What gets saved: reasons only for the items that failed.
function evalPayload(v){
 var p={failReasons:{}};
 EVAL_ITEMS.forEach(function(i){var k=i[0];p[k]=v[k];if(v[k]==='不合格'&&failReason(v,k))p.failReasons[k]=failReason(v,k)});
 if(!Object.keys(p.failReasons).length)delete p.failReasons;
 p.lateMinutes=Number(v.lateMinutes)||0;
 return p;
}
function evalKey(v){return JSON.stringify(EVAL_ITEMS.map(function(i){return [v[i[0]]||'',v[i[0]]==='不合格'?failReason(v,i[0]):'']}).concat([Number(v.lateMinutes)||0]))}
var TABS=[['confirm','營業額與確認'],['coach','教練'],['visiting','跑課'],['instructor','教官']];
var LABELS={partTime:'兼職教練',visiting:'跑課老師',instructor:'教官課程'};
var S={progress:null,boss:null,tokenInput:'',me:null,token:'',view:null,branch:'',tab:'coach',drafts:{},picked:{},errors:{},form:null,msg:null,withdrawing:null,withdrawReason:'',saving:{},phase:'',since:0,queue:Promise.resolve(),storeKey:''};
function picked(id){return S.picked[id]||(S.picked[id]=[])}
function refreshBusy(){
 var n=savingCount(),box=document.getElementById('busy');
 if(n&&!S.since)S.since=Date.now();
 if(!n){S.since=0;S.phase=''}
 working(n>0);
 box.style.display=n?'flex':'none';
 if(n){
  var secs=Math.floor((Date.now()-S.since)/1000);
  document.getElementById('busyText').textContent=(S.phase||'處理中，請稍候')+(secs>=2?'（'+secs+' 秒）':'…');
 }
}
setInterval(function(){if(S.since)refreshBusy()},1000);
function sameName(a,b){return String(a).trim().toLowerCase()===String(b).trim().toLowerCase()}
function setMsg(text,kind){S.msg=text?{text:text,kind:kind||'good'}:null}
function savingCount(){return Object.keys(S.saving).length}
// Saves run one after another in the background, so the page stays usable; nothing is shown as saved until the server says so.
function run(id,task,ok,okText,phase){
 S.saving[id]=true;S.phase=phase||S.phase;setMsg('');render();
 S.queue=S.queue.then(task).then(function(r){delete S.saving[id];if(ok)ok(r);if(okText)setMsg(okText);render()})
  .catch(function(e){delete S.saving[id];setMsg(e.message||String(e),'bad');render();window.scrollTo(0,0)});
}
function mergeSaved(r){
 var gone=(r.removed||[]).concat(r.line?[r.line.key]:[]);
 S.view.lines=S.view.lines.filter(function(l){return gone.indexOf(l.key)<0});
 if(r.line)S.view.lines.push(r.line);
}
function lineOf(kind,branch,english){return S.view.lines.filter(function(l){return l.kind===kind&&l.branch===branch&&sameName(l.english,english)})[0]}
function linesOf(kind){return S.view.lines.filter(function(l){return l.kind===kind&&l.branch===S.branch})}
function branchStaff(){return S.view.staff.filter(function(s){return s.branch===S.branch})}

// Unsaved cards survive closing the page: kept only on this phone until saved.
function storeDrafts(){
 var keep={};
 S.view.staff.forEach(function(s){var n=cardState(s).name;if(n==='ready'||n==='missing')keep[cardId(s)]=draftOf(s)});
 try{localStorage.setItem(S.storeKey,JSON.stringify(keep))}catch(e){}
}
function loadDrafts(){try{S.drafts=JSON.parse(localStorage.getItem(S.storeKey)||'{}')||{}}catch(e){S.drafts={}}}

// ---------- coach cards: each coach is either full-time (三項考核) or part-time (工時), all saved together ----------
function cardId(s){return s.branch+'|'+s.english}
function draftOf(s){
 var k=cardId(s);if(S.drafts[k])return S.drafts[k];
 var ev=lineOf('evaluation',s.branch,s.english),pt=lineOf('partTime',s.branch,s.english),p=pt?pt.payload:{};
 return S.drafts[k]={type:pt?'partTime':ev?'fullTime':(s.defaultKind||'fullTime'),values:ev?JSON.parse(JSON.stringify(ev.payload)):{},hours:pt?String(p.hours):'',holidayHours:pt?String(p.holidayHours||0):'',attachments:pt?(pt.attachments||[]).slice():[],reason:''};
}
/** What a card needs: saved (nothing to do) / empty (untouched) / ready (can be saved) / missing:<what>. */
function cardState(s){
 var d=draftOf(s),ev=lineOf('evaluation',s.branch,s.english),pt=lineOf('partTime',s.branch,s.english),had=!!(ev||pt);
 var newFiles=picked(cardId(s)).length;
 var picked3=EVAL_ITEMS.every(function(i){return !!d.values[i[0]]});
 var reasoned=EVAL_ITEMS.every(function(i){return d.values[i[0]]!=='不合格'||!!failReason(d.values,i[0])});
 var filled=d.type==='fullTime'?picked3&&reasoned:d.hours!==''&&d.attachments.length+newFiles>0;
 var ids=function(list){return list.map(function(a){return a.id}).join()};
 var changed;
 if(d.type==='fullTime')changed=pt?true:ev?evalKey(d.values)!==evalKey(ev.payload):EVAL_ITEMS.some(function(i){return !!d.values[i[0]]});
 else changed=ev?true:pt?Number(d.hours)!==pt.payload.hours||Number(d.holidayHours||0)!==(pt.payload.holidayHours||0)||ids(d.attachments)!==ids(pt.attachments||[])||newFiles>0:(d.hours!==''||d.attachments.length+newFiles>0);
 if(!changed)return {name:had?'saved':'empty',had:had};
 if(!filled)return {name:'missing',had:had,what:d.type==='fullTime'?(picked3?'沒填不合格原因':'考核沒選完'):d.hours===''?'沒填工時':'沒選紙本'};
 if(had&&!d.reason.trim())return {name:'missing',had:had,what:'沒填修改原因'};
 return {name:'ready',had:had};
}
function touch(){storeDrafts();renderBar()}
function coachCard(s){
 var d=draftOf(s),st=cardState(s),id=cardId(s),busy=!!S.saving['card:'+id];
 var badge=busy?el('span',{class:'badge edit'},el('span',{class:'spin',style:'width:11px;height:11px;margin-right:4px;vertical-align:-1px'}),'儲存中'):st.name==='saved'?el('span',{class:'badge',text:'已儲存'}):st.name==='empty'?el('span',{class:'badge todo',text:'未填'}):el('span',{class:'badge edit',text:'未儲存'});
 var card=el('div',{class:'card'},el('div',{class:'row'},el('h3',{text:s.english+'（'+s.title+'）'}),badge));
 if(S.errors[id])card.appendChild(el('div',{class:'err',text:S.errors[id],style:'font-size:14px;margin-top:4px'}));
 var ptLine=lineOf('partTime',s.branch,s.english);
 if(ptLine&&ptLine.ownerEdited)card.appendChild(el('div',{class:'muted',text:'老闆審核後已修改數字。'}));
 var pick=function(field,value){return function(){d[field]=value;delete S.errors[id];storeDrafts();render()}};
 if(s.title==='教練'){
  // One or the other: only the chosen kind's fields are shown, so it never looks like both need filling in.
  var option=function(value,text){return el('label',{class:d.type===value?'on':''},
   el('input',{type:'radio',name:'kind:'+id,checked:d.type===value,disabled:busy,on:{change:pick('type',value)}}),text)};
  card.appendChild(el('div',{class:'choice'},option('fullTime','全職教練'),option('partTime','兼職教練')));
 }else card.appendChild(el('div',{class:'muted',text:'副理只有在分店虧損時才依考核計算，平常仍請填寫。'}));
 if(d.type==='fullTime'){
  EVAL_ITEMS.forEach(function(i){
   var val=d.values[i[0]],set=function(x){return function(){d.values[i[0]]=x;delete S.errors[id];storeDrafts();render()}};
   card.appendChild(el('div',{class:'item row'},el('span',{text:i[1]}),el('div',{class:'seg'},
    el('button',{class:val==='合格'?'pass':'',text:'合格',disabled:busy,on:{click:set('合格')}}),
    el('button',{class:val==='不合格'?'fail':'',text:'不合格',disabled:busy,on:{click:set('不合格')}}))));
   if(val==='不合格'){
    d.values.failReasons=d.values.failReasons||{};
    if(d.values.failReasons[i[0]]===undefined)d.values.failReasons[i[0]]='';
    card.appendChild(field(d.values.failReasons,i[0],i[1]+'不合格原因（必填）',{disabled:busy},id+':why',touch));
   }
  });
  if(d.values.lateMinutes===undefined||d.values.lateMinutes===null)d.values.lateMinutes='0';
  else d.values.lateMinutes=String(d.values.lateMinutes);
  card.appendChild(field(d.values,'lateMinutes','本月遲到（分鐘，沒有遲到就留 0）',{type:'number',inputMode:'numeric',step:'1',min:'0',disabled:busy},id+':late',touch));
 }else{
  card.appendChild(el('div',{class:'two'},
   field(d,'hours','一般工時（小時）',{type:'number',inputMode:'decimal',step:'0.5',min:'0',disabled:busy},id,touch),
   field(d,'holidayHours','國定假日工時',{type:'number',inputMode:'decimal',step:'0.5',min:'0',disabled:busy},id,touch)));
  attachmentBox(card,d,picked(id),busy);
 }
 if(st.had&&st.name!=='saved'&&st.name!=='empty'){
  card.appendChild(field(d,'reason','修改原因（必填）',{disabled:busy},id,touch));
 }
 return card;
}
function renderCoach(m){
 var staff=branchStaff();
 if(!staff.length)m.appendChild(el('div',{class:'card muted',text:S.branch+' 沒有全職教練或副理。'}));
 else{
  var n=staff.filter(function(s){return cardState(s).name==='saved'}).length;
  m.appendChild(el('div',{class:'muted',text:S.branch+'：已儲存 '+n+' / '+staff.length+' 人',style:'margin:0 2px 8px'}));
  staff.forEach(function(s){m.appendChild(coachCard(s))});
 }
 // Part-time coaches who aren't in the 人資資料庫 list for this branch.
 linesOf('partTime').filter(function(l){return !staff.some(function(s){return sameName(s.english,l.english)})}).forEach(function(l){m.appendChild(lineCard(l))});
 if(S.form&&S.form.kind==='partTime')m.appendChild(lineForm(S.form));
 else if(S.view.windows.provide.open)m.appendChild(el('button',{class:'link',text:'＋ 新增不在名單上的兼職教練',on:{click:function(){S.form=blankForm('partTime');S.withdrawing=null;setMsg('');render()}}}));
}
// Every selected card, with its photos, goes up together; very large sets are split so one request stays within the limit.
var MAX_REQUEST=19000000;
function saveAll(){
 var picks=S.view.staff.filter(function(s){return cardState(s).name==='ready'&&!S.saving['card:'+cardId(s)]});
 if(!picks.length)return;
 var build=picks.map(function(s){
  var d=draftOf(s),had=cardState(s).had,reason=had?d.reason.trim():undefined;
  if(d.type==='fullTime')return Promise.resolve({kind:'evaluation',branch:s.branch,english:s.english,payload:evalPayload(d.values),reason:reason});
  return Promise.all(picked(cardId(s)).map(preparedFile)).then(function(files){
   return {kind:'partTime',branch:s.branch,english:s.english,payload:{hours:Number(d.hours),holidayHours:Number(d.holidayHours||0),attachmentIds:d.attachments.map(function(a){return a.id})},reason:reason,
    files:files.map(function(p){return {fileName:p.name,mime:p.mime,base64:p.base64}})};
  });
 });
 var hasPhotos=picks.some(function(s){return draftOf(s).type==='partTime'&&picked(cardId(s)).length>0});
 picks.forEach(function(s){S.saving['card:'+cardId(s)]=true;delete S.errors[cardId(s)]});
 S.phase=hasPhotos?'正在處理相片':'正在儲存 '+picks.length+' 位';
 setMsg('');render();
 var saved=0,failed=0;
 var finish=function(card,r){var id=cardId(card);delete S.saving['card:'+id];
  if(r.ok){saved++;mergeSaved(r);delete S.drafts[id];delete S.picked[id]}else{failed++;S.errors[id]=r.error}};
 S.queue=S.queue.then(function(){return Promise.all(build)}).then(function(lines){
  S.phase=hasPhotos?'正在上傳相片並儲存 '+picks.length+' 位':S.phase;refreshBusy();
  var chunks=[],size=0;
  lines.forEach(function(l,i){
   var n=JSON.stringify(l).length;
   if(!chunks.length||size+n>MAX_REQUEST){chunks.push([]);size=0}
   chunks[chunks.length-1].push(i);size+=n;
  });
  return chunks.reduce(function(p,idx){return p.then(function(){
   return call('portalSubmitMany',S.token,S.view.month,idx.map(function(i){return lines[i]})).then(function(res){
    res.results.forEach(function(r,k){finish(picks[idx[k]],r)});render();
   });
  })},Promise.resolve());
 }).then(function(){
  storeDrafts();
  setMsg(failed?saved+' 位已儲存，'+failed+' 位沒有存好，請看卡片上的原因':saved+' 位已儲存',failed?'bad':'good');
  render();window.scrollTo(0,0);
 }).catch(function(e){
  picks.forEach(function(s){delete S.saving['card:'+cardId(s)]});
  storeDrafts();
  setMsg('沒有存好，資料還留在畫面上，請再按一次：'+(e.message||e),'bad');render();window.scrollTo(0,0);
 });
}
function renderBar(){
 var b=document.getElementById('bar');b.textContent='';
 if(S.tab==='mine'){renderMineBar(b);return}
 var show=S.view&&S.tab==='coach'&&S.view.windows.provide.open;
 document.body.className=show?'has-bar':'';
 if(!S.view)return;
 if(!show)return;
 var ready=0,saving=0,missing=[];
 S.view.staff.forEach(function(s){
  if(S.saving['card:'+cardId(s)]){saving++;return}
  var st=cardState(s);if(st.name==='ready')ready++;if(st.name==='missing')missing.push(s.english+' '+st.what);
 });
 var box=el('div',{class:'bar'});
 if(missing.length)box.appendChild(el('div',{class:'muted',text:'還沒填完，這次不會存：'+missing.join('、')}));
 var label=saving&&!ready?'儲存中，請先不要關閉頁面':ready?'全部儲存（'+ready+' 位）':'沒有要儲存的資料';

 });
 if(p.stale)c.appendChild(el('div',{class:'notice warn mt',text:'確認後有修改，按下確認申報才會通知教練和副理。'}));
 else if(p.confirmed)c.appendChild(el('div',{class:'notice good mt',text:'已於 '+localTime(p.confirmedAt)+' 確認申報，教練和副理已收到通知。'}));
 if(!p.confirmed){
  c.appendChild(el('div',{class:'muted mt',text:'請確認營業額無誤、申報資料都填好後再按。按下後會立刻用 LINE 通知您的教練和副理；6 日之後確認就不能再修改。'}));
  c.appendChild(el('button',{class:'primary mt',text:'確認申報',disabled:busy||!v.windows.confirm.open||!p.filled,on:{click:function(){
   if(!window.confirm('確認營業額無誤、申報資料都已填好？按下後會通知您的教練和副理。'))return;
   run('confirm',function(){return call('portalManagerConfirm',S.token,v.month)},function(r){S.view=r.view;S.preview=null;setMsg('已確認申報，已通知 '+r.told.length+' 人。')},null,'正在確認申報並通知教練，請先不要關閉頁面');
  }}}));
 }
 m.appendChild(c);
 if(p.confirmedAt){
  var pc=el('div',{class:'card'},el('h3',{text:'應發薪資預覽'}),el('div',{class:'muted',text:'依目前資料計算，不含缺勤扣款和代扣勞健保，實際金額以薪資單為準。'}));
  pc.appendChild(el('button',{class:'mt',style:'width:100%',text:S.preview?'重新計算':'預覽所屬教練的應發薪資',disabled:busy,on:{click:function(){
   run('confirm',function(){return call('portalManagerPreview',S.token,v.month)},function(r){S.preview=r},null,'正在計算');
  }}}));
  m.appendChild(pc);
  if(S.preview)S.preview.rows.forEach(function(r){
   var pr=el('div',{class:'card'},el('div',{class:'row'},el('h3',{text:r.english+'（'+r.branch+'）'}),el('b',{class:r.error?'err':'',text:r.error?'無法計算':money(r.gross)})));
   if(r.error)pr.appendChild(el('div',{class:'err',text:r.error}));
   (r.lines||[]).forEach(function(l){pr.appendChild(el('div',{class:'kv'},el('span',{text:l.label+(l.calc?'（'+l.calc+'）':'')}),el('b',{text:money(Math.round(l.amount))})))});
   m.appendChild(pr);
  });
 }
}
// Phone photos are shrunk (longest side 2200 px, still readable) so uploads stay quick on mobile data; PDFs and anything the browser can't decode go as they are.
function preparedFile(file){
 var raw=function(){return new Promise(function(ok,no){var r=new FileReader();r.onerror=function(){no(Error('讀不到這個檔案'))};
  r.onload=function(){ok({name:file.name,mime:file.type,base64:String(r.result).split(',')[1]||''})};r.readAsDataURL(file)})};
 if(!/^image\//.test(file.type))return raw();
 return new Promise(function(ok){
  var url=URL.createObjectURL(file),img=new Image();
  img.onerror=function(){URL.revokeObjectURL(url);ok(raw())};
  img.onload=function(){
   var scale=Math.min(1,2200/Math.max(img.width,img.height)),c=document.createElement('canvas');
   c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
   var data=c.toDataURL('image/jpeg',0.85);
   if(data.indexOf('data:image/jpeg')!==0){ok(raw());return}
   ok({name:file.name.replace(/\.[^.]+$/,'')+'.jpg',mime:'image/jpeg',base64:data.split(',')[1]});
  };
  img.src=url;
 });
}
function render(){
 // A background save can finish while someone is typing: keep their cursor where it was.
 var a=document.activeElement,focusId=a&&a.getAttribute&&a.getAttribute('data-f'),caret=null;
 if(focusId)try{caret=a.selectionStart}catch(e){}
 var m=document.getElementById('main'),v=S.view,w=v&&v.windows;m.textContent='';
 if(v&&S.tab!=='mine'){
  if(!w.provide.open)m.appendChild(el('div',{class:'notice bad',text:'目前不能填報：'+w.provide.reason}));
  else if(!(v.progress&&v.progress.confirmed))m.appendChild(el('div',{class:'notice warn',text:'請儘快填完，教練和副理才看得到完整資料。'}));
 }
 if(S.msg)m.appendChild(el('div',{class:'notice '+(S.msg.kind==='bad'?'bad':'good'),text:S.msg.text}));
 if(v&&S.tab!=='confirm'&&v.branches.length>1){
  var chips=el('div',{class:'chips'});
  v.branches.forEach(function(b){chips.appendChild(el('button',{class:'chip'+(b===S.branch?' on':''),text:b,on:{click:function(){S.branch=b;S.form=null;S.withdrawing=null;setMsg('');render()}}}))});
  m.appendChild(chips);
 }
 if(v){
  var tabs=el('div',{class:'tabs'});
  TABS.forEach(function(t){tabs.appendChild(el('button',{class:'tab'+(t[0]===S.tab?' on':''),text:t[1],on:{click:function(){S.tab=t[0];S.form=null;S.withdrawing=null;setMsg('');
   if(t[0]==='confirm'&&!savingCount())run('view',function(){return call('portalManagerView',S.token,v.month)},function(r){S.view=r},null,'正在讀取');
   render()}}}))});
  m.appendChild(tabs);
 }
 if(S.boss)bossTabs(m);
 if(S.tab==='progress')renderProgress(m);else if(S.tab==='boss')renderBoss(m);else if(S.tab==='mine')renderMine(m);else if(S.tab==='confirm')renderConfirm(m);else if(S.tab==='coach')renderCoach(m);else renderLines(m,S.tab);
 renderBar();refreshBusy();
 if(focusId){
  var again=m.querySelector('[data-f="'+focusId.replace(/"/g,'')+'"]');
  if(again){again.focus();if(caret!==null)try{again.setSelectionRange(caret,caret)}catch(e){}}
 }
}
